name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated pages match tools/build.py and the demo sources
        run: |
          python3 tools/build.py
          python3 tools/make_demos.py
          git diff --exit-code
      - name: Page checks (head tags, alt text, sitemap, no contact details, deploy allowlist)
        run: python3 tools/check_site.py
      - name: No claude.ai artifact or session links (public repo)
        run: |
          if grep -rnE "claude\.ai/(artifact|code)/" --exclude-dir=.git --exclude-dir=.github .; then
            echo "Remove claude.ai links: they live in project memory, not this public repo."; exit 1
          fi
      - name: No internal page links to missing files
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for page in pathlib.Path(".").glob("*.html"):
              for href in re.findall(r'(?:href|src)="([^"#?]+)', page.read_text()):
                  if href.startswith(("http", "mailto:", "/")):
                      continue
                  target = page.parent / href
                  if href.endswith("/"):
                      target = target / "index.html"
                  if not target.exists():
                      bad.append(f"{page}: {href}")
          print("\n".join(bad) or "All internal links resolve.")
          sys.exit(1 if bad else 0)
          PY
      - name: Agent roster matches CLAUDE.md (studio-agents check-agents.sh)
        run: bash scripts/check-agents.sh
