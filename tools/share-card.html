<!doctype html>
<!-- Source for assets/share-card.png (1200x630), the link preview LinkedIn and others show. Render: node tools/make_share_card.mjs -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px}
body{background:#F7F6F1;color:#16231D;font-family:"Public Sans",system-ui,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:72px 84px;box-sizing:border-box;border-bottom:14px solid #1F5C44}
.top{display:flex;align-items:center;gap:18px;font:600 30px "Fraunces",Georgia,serif}
.mono{width:64px;height:64px;border-radius:50%;background:#1F5C44;color:#fff;display:grid;place-items:center;font:600 24px "Public Sans",sans-serif;letter-spacing:.04em}
.eyebrow{font:500 22px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A5B0B}
h1{font:600 68px/1.08 "Fraunces",Georgia,serif;margin:14px 0 0;letter-spacing:-.015em;max-width:1000px;text-wrap:balance}
.foot{display:flex;justify-content:space-between;font-size:26px;color:#56645C}
.foot b{color:#1F5C44}
.photo{position:absolute;right:84px;top:72px;width:260px;height:260px;border-radius:50%;object-fit:cover;border:1px solid #DCDFD6}
h1{max-width:700px}
body{position:relative}
</style></head><body>
<img class="photo" src="../assets/chase-800.webp" alt="">
<div class="top"><span class="mono">CH</span>Chase Holroyd</div>
<div><div class="eyebrow">Staff product manager · open to remote roles</div>
<h1>Pricing, payments and point-of-sale lending.</h1></div>
<div class="foot"><span>8+ years · Palmetto · ADT · Patter AI</span><b>chaseholroyd.com</b></div>
</body></html>
